<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Ice Watch - Site Detail</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/starfield.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>
<div class="navbar" role="navigation" aria-label="Primary navigation">
  <div class="brand"><span class="brand-moon" aria-hidden="true">☾</span><span class="dot" aria-hidden="true"></span>LUNAR ICE WATCH</div>
  <div class="links d-flex align-items-center flex-wrap gap-1">
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="upload.html">Upload</a>
    <a href="map.html">Map</a>
    <a href="traverse.html">Traverse</a>
    <a href="index.html#about">About</a>
    <button class="theme-toggle" type="button" onclick="toggleMoonMode()" aria-label="Toggle moonlight interface mode" title="Toggle moonlight mode">☾ Moonlight</button>
    <a href="#" onclick="logout(); return false;">Logout</a>
  </div>
</div>

<main class="container" id="main-content">
  <a href="dashboard.html" class="back-link">&larr; back to dashboard</a>
  <section class="page-hero">
    <p class="eyebrow">Candidate Evidence</p>
    <h1 id="siteTitle">Site</h1>
    <p class="subtext" id="siteSub"></p>
  </section>

  <div class="row g-3">
    <div class="card col-md-6">
      <h3>Radar Metrics</h3>
      <div id="metricsBox"></div>
    </div>

    <div class="card col-md-6">
      <h3>Gates &amp; Flags</h3>
      <p>Thermal Gate: <span class="pill" id="thermalPill"></span></p>
      <p class="subtext" id="thermalTempText"></p>
      <p>Alt-Explanation Flag: <span class="pill" id="altPill"></span></p>
      <p class="subtext" id="altNoteText"></p>
      <p>Boulder Count (optical): <span id="boulderText"></span></p>
      <div class="gauge-wrap" id="hazardGauge"></div>
    </div>
  </div>

  <div class="card">
    <h3>Evidence Engine Result</h3>
    <p><span class="badge" id="classBadge" style="font-size:14px;padding:6px 14px;"></span></p>
    <p class="subtext">Strong evidence tier: <span id="tierText"></span></p>
    <p id="rationaleText" class="rationale"></p>
    <a class="back-link" id="traverseLink" href="#">view rover traverse &rarr;</a>
  </div>
</main>

<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script src="js/starfield.js"></script>
<script src="js/cursor.js"></script>
</body>
</html>
