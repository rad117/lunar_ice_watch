<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lunar Ice Watch - Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/premium.css">
<link rel="stylesheet" href="css/starfield.css">
</head>
<body>

<a class="skip-link" href="#main-content">Skip to content</a>
<!-- Same top navbar as index.html, but "Logout" replaces "Login" since this is a logged-in page -->
<div class="navbar" role="navigation" aria-label="Primary navigation">
  <div class="brand"><span class="brand-moon" aria-hidden="true">☾</span><span class="dot" aria-hidden="true"></span>LUNAR ICE WATCH</div>
  <div class="links d-flex align-items-center flex-wrap gap-1">
    <a href="index.html">Home</a>
    <a href="upload.html">Upload</a>
    <a href="map.html">Map</a>
    <a href="traverse.html">Traverse</a>
    <a href="index.html#about">About</a>
    <button class="theme-toggle" type="button" onclick="toggleMoonMode()" aria-label="Toggle moonlight interface mode" title="Toggle moonlight mode">☾ Moonlight</button>
    <a href="#" onclick="logout(); return false;">Logout</a>
  </div>
</div>

<main class="container" id="main-content">
  <!-- Page title banner: "Candidate Site Overview" -->
  <section class="page-hero" aria-labelledby="dashboard-title">
    <p class="eyebrow">Lunar South Pole · Mission Control</p>
    <h1 id="dashboard-title">Candidate Site Overview</h1>
    <p class="subtext">Screen permanently shadowed regions using thermal, radar and terrain evidence in one calm workspace.</p>
  </section>

  <!-- Summary number tiles (e.g. total sites, how many ice-supported); filled in by js/dashboard.js -->
  <div class="stats-row d-flex flex-wrap gap-3 mb-4" id="statsRow"></div>

  <!-- Filter chips (All / ICE-SUPPORTED-HIGH / etc.); clicking one filters the table below -->
  <div class="chip-row d-flex flex-wrap gap-2 mb-3" id="chipRow" role="toolbar" aria-label="Filter candidate sites"></div>

  <!-- Main results table: headers here are static, rows (#siteTable) are built dynamically by js/dashboard.js from js/data.js -->
  <div class="table-wrap"><table aria-label="Candidate site screening results">
    <thead>
      <tr id="tableHead">
        <th class="sortable" data-key="label">Site<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="crater">Crater / Region<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="thermalGate">Thermal Gate<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="terrainHazard">Hazard<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="classification">Classification<span class="sort-arrow">&#9650;</span></th>
      </tr>
    </thead>
    <tbody id="siteTable"></tbody>
  </table></div>
</main>

<!-- data.js supplies the site records; dashboard.js reads them and builds statsRow/chipRow/siteTable above -->
<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/starfield.js"></script>
<script src="js/cursor.js"></script>
</body>
</html>
