<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lunar Ice Watch - Upload</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="brand">LUNAR ICE WATCH</div>
  <div>
    <a href="index.html">Dashboard</a>
    <a href="upload.html">Upload</a>
    <a href="map.html">Map</a>
    <a href="traverse.html">Traverse</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
  <h1>Upload Radar / Thermal Data</h1>
  <p class="subtext">Add a new observation pass and run it through the screening pipeline</p>

  <div class="card">
    <label for="siteName">Site name</label>
    <input type="text" id="siteName" placeholder="e.g. Site B1">

    <label for="fileInput">Data file</label>
    <input type="file" id="fileInput">

    <button onclick="startUpload()">Run Analysis</button>

    <div class="progress-bg" id="progressWrap" style="display:none">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p id="statusText" class="subtext"></p>
  </div>
</div>

<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script src="js/upload.js"></script>
</body>
</html>
