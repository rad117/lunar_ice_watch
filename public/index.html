<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lunar Ice Watch - Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
  <div class="brand"><span class="dot"></span>LUNAR ICE WATCH</div>
  <div class="links d-flex align-items-center flex-wrap gap-1">
    <a href="index.html">Dashboard</a>
    <a href="upload.html">Upload</a>
    <a href="map.html">Map</a>
    <a href="traverse.html">Traverse</a>
    <a href="#" onclick="logout()">Logout</a>
  </div>
</div>

<div class="container">
  <h1>Candidate Site Overview</h1>
  <p class="subtext">South pole permanently shadowed regions currently under screening</p>

  <div class="stats-row d-flex flex-wrap gap-3 mb-4" id="statsRow"></div>

  <div class="chip-row d-flex flex-wrap gap-2 mb-3" id="chipRow"></div>

  <table>
    <thead>
      <tr id="tableHead">
        <th class="sortable" data-key="label">Site<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="crater">Crater / Region<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="thermalGate">Thermal Gate<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="terrainHazard">Hazard<span class="sort-arrow">&#9650;</span></th>
        <th class="sortable" data-key="classification">Classification<span class="sort-arrow">&#9650;</span></th>
      </tr>
    </thead>
    <tbody id="siteTable"></tbody>
  </table>
</div>

<script src="js/ui.js"></script>
<script src="js/nav.js"></script>
<script src="js/data.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
