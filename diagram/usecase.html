<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Use Case Diagram</title>
<style>
body { margin: 0; background: #ffffff; font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<svg width="1250" height="560" viewBox="0 0 1250 560" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="1250" height="560" fill="#ffffff"/>
  <text x="625" y="28" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">Lunar Ice Watch - Use Case Diagram</text>

  <rect x="200" y="48" width="820" height="435" fill="none" stroke="#222" stroke-width="2"/>
  <text x="220" y="70" font-size="15" font-weight="bold" fill="#111">Lunar Ice Watch System</text>

  <!-- actor: Mission Analyst -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="90" cy="225" r="14"/>
    <line x1="90" y1="239" x2="90" y2="280"/>
    <line x1="68" y1="257" x2="112" y2="257"/>
    <line x1="90" y1="280" x2="72" y2="315"/>
    <line x1="90" y1="280" x2="108" y2="315"/>
  </g>
  <text x="90" y="335" text-anchor="middle" font-size="13" fill="#111">Mission Analyst</text>

  <!-- actor: Screening System -->
  <g stroke="#111" stroke-width="2" fill="none">
    <circle cx="1150" cy="370" r="14"/>
    <line x1="1150" y1="384" x2="1150" y2="425"/>
    <line x1="1128" y1="402" x2="1172" y2="402"/>
    <line x1="1150" y1="425" x2="1132" y2="460"/>
    <line x1="1150" y1="425" x2="1168" y2="460"/>
  </g>
  <text x="1150" y="480" text-anchor="middle" font-size="13" fill="#111">Screening System</text>

  <!-- use case ellipses -->
  <g font-size="13" fill="#111" text-anchor="middle">
    <ellipse cx="350" cy="125" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="350" y="130">Login</text>

    <ellipse cx="610" cy="125" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="610" y="130">View Dashboard</text>

    <ellipse cx="870" cy="125" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="870" y="130">Upload Data</text>

    <ellipse cx="350" cy="260" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="350" y="265">View Site Evidence</text>

    <ellipse cx="610" cy="260" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="610" y="265">View Hazard Map</text>

    <ellipse cx="870" cy="260" rx="115" ry="35" fill="#eaf4ff" stroke="#222" stroke-width="1.5"/>
    <text x="870" y="256">Simulate Rover</text>
    <text x="870" y="272">Traverse</text>

    <ellipse cx="480" cy="405" rx="140" ry="38" fill="#fdf1d6" stroke="#222" stroke-width="1.5"/>
    <text x="480" y="401">Compute Evidence</text>
    <text x="480" y="417">Metrics</text>

    <ellipse cx="760" cy="405" rx="110" ry="34" fill="#fdf1d6" stroke="#222" stroke-width="1.5"/>
    <text x="760" y="409">Classify Site</text>
  </g>

  <!-- actor associations: Mission Analyst -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="104" y1="239" x2="245" y2="130"/>
    <line x1="104" y1="247" x2="505" y2="130"/>
    <line x1="104" y1="255" x2="765" y2="130"/>
    <line x1="104" y1="263" x2="245" y2="265"/>
    <line x1="104" y1="271" x2="505" y2="265"/>
    <line x1="104" y1="279" x2="765" y2="265"/>
  </g>

  <!-- actor association: Screening System -->
  <line x1="1136" y1="402" x2="875" y2="405" stroke="#333" stroke-width="1.3"/>

  <!-- include: Upload Data -> Compute Evidence Metrics -->
  <path d="M 870 160 L 870 195 L 740 195 L 740 340 L 560 340 L 505 372"
        fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="600" y="332" font-size="12" fill="#333">&lt;&lt;include&gt;&gt;</text>

  <!-- include: Compute Evidence Metrics -> Classify Site -->
  <path d="M 620 405 L 650 405" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="588" y="390" font-size="12" fill="#333">&lt;&lt;include&gt;&gt;</text>

  <!-- extend: Simulate Rover Traverse -> View Hazard Map -->
  <path d="M 755 260 L 727 260" fill="none" stroke="#555" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="700" y="245" font-size="12" fill="#333">&lt;&lt;extend&gt;&gt;</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>
</svg>
</body>
</html>
